name: Publish to npm

on:
  release:
    types: [published]
  # Manual fallback: release-please's GITHUB_TOKEN can't trigger downstream
  # workflows (anti-loop protection), so the release event from a release-
  # please-created Release doesn't fire this workflow. workflow_dispatch
  # lets us publish manually until that's fixed via a GitHub App token.
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or ref to publish (e.g. v1.1.0)'
        required: true
        type: string

# One publish at a time per repo. A release can fire both the `release`
# event and a manual dispatch; the second run queues, then skips below.
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing (OIDC) requires npm >= 11.5. setup-node@v4 ships
      # whatever ships with node 20 (~npm 10.x), which is too old. Pin npm@11
      # (>=11.5, OIDC-capable) rather than npm@latest: npm@12 dropped Node 20
      # (engine ^22.22.2 || ^24.15.0 || >=26) and would fail EBADENGINE here,
      # whereas npm@11's engine is ^20.17.0 || >=22.9.0 — compatible with the
      # pinned Node 20 runner above.
      - run: npm install -g npm@11

      - run: npm ci
      - run: npm run build

      # Trusted Publishing: npm CLI authenticates via the OIDC token granted
      # by `id-token: write` above. No NPM_TOKEN required as long as the
      # package has a matching Trusted Publisher registered on npmjs.com
      # (owner: mharnett, repo: mcp-gtm-ga4, workflow: publish.yml).
      - name: Skip if this version is already on npm
        id: published
        run: |
          spec="$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")"
          if npm view "$spec" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$spec is already on npm; skipping publish (${{ github.event_name }} run)"
          fi

      - if: steps.published.outputs.skip != 'true'
        run: npm publish --provenance --access public
